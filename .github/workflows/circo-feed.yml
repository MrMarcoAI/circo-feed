name: CIRCO FEED diario

on:
  schedule:
    # 10:00 UTC = 07:00 en Santiago (horario de verano): lectura de la mañana + mail
    - cron: "0 10 * * *"
    # cada 3 horas durante el día, para que "Hoy" se mantenga al día (sin mail)
    - cron: "0 13,16,19,22,1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer feeds
        run: python3 tools/fetch.py
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet && exit 0
          git commit -m "CIRCO FEED: artículos del día"
          git push
      - name: Mandar resumen por mail
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python3 tools/send_digest.py
